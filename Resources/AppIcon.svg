<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- NotchCue app icon. 824x824 body on a 1024 canvas (macOS icon grid). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3A5CFF"/>
      <stop offset="0.42" stop-color="#1E2C8F"/>
      <stop offset="1" stop-color="#0B0D16"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="500" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#AFA4FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7C86FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#365AFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE3FF"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
    <rect x="100" y="100" width="824" height="412" fill="url(#sheen)"/>

    <!-- camera notch -->
    <path d="M318 100 H706 V174 a58 58 0 0 1 -58 58 H376 a58 58 0 0 1 -58 -58 Z" fill="#05060A"/>
    <circle cx="512" cy="164" r="19" fill="#141826"/>
    <circle cx="512" cy="164" r="9" fill="#2A3A8C"/>
    <circle cx="507" cy="159" r="3.5" fill="#8FA2FF" fill-opacity="0.9"/>

    <!-- line already read (dimmed) -->
    <rect x="212" y="340" width="500" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.20"/>

    <!-- current line: lit with a soft glow -->
    <rect x="212" y="448" width="600" height="84" rx="42" fill="#8C9BFF" opacity="0.9" filter="url(#glow)"/>
    <rect x="212" y="448" width="600" height="84" rx="42" fill="url(#live)"/>

    <!-- next line (upcoming) -->
    <rect x="212" y="582" width="420" height="58" rx="29" fill="#C9CFFF" fill-opacity="0.50"/>

    <!-- voice waveform accent -->
    <g fill="#AFA4FF">
      <rect x="401" y="736" width="22" height="44" rx="11" fill-opacity="0.55"/>
      <rect x="441" y="712" width="22" height="92" rx="11" fill-opacity="0.8"/>
      <rect x="481" y="694" width="22" height="128" rx="11"/>
      <rect x="521" y="716" width="22" height="84" rx="11" fill-opacity="0.85"/>
      <rect x="561" y="704" width="22" height="108" rx="11" fill-opacity="0.75"/>
      <rect x="601" y="740" width="22" height="36" rx="11" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- hairline edge -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>
